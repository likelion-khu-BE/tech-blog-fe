<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" fill="none">
  <rect width="800" height="400" fill="#111113"/>
  <text x="400" y="40" text-anchor="middle" fill="#55555C" font-family="monospace" font-size="11">OAuth2 Authorization Code Flow</text>

  <!-- Actors -->
  <rect x="60" y="70" width="100" height="40" rx="6" fill="#2D1F5E"/>
  <text x="110" y="95" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="10">Client</text>

  <rect x="350" y="70" width="100" height="40" rx="6" fill="#1E3A5F"/>
  <text x="400" y="95" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="10">GitHub</text>

  <rect x="640" y="70" width="100" height="40" rx="6" fill="#1A3F2E"/>
  <text x="690" y="95" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">Server</text>

  <!-- Vertical lines -->
  <line x1="110" y1="110" x2="110" y2="360" stroke="#2A2A30" stroke-width="1"/>
  <line x1="400" y1="110" x2="400" y2="360" stroke="#2A2A30" stroke-width="1"/>
  <line x1="690" y1="110" x2="690" y2="360" stroke="#2A2A30" stroke-width="1"/>

  <!-- Step 1 -->
  <line x1="110" y1="145" x2="400" y2="145" stroke="#8B5CF6" stroke-width="1"/>
  <polygon points="395,140 405,145 395,150" fill="#8B5CF6"/>
  <text x="255" y="138" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="9">1. Authorize Request</text>

  <!-- Step 2 -->
  <line x1="400" y1="190" x2="110" y2="190" stroke="#8B5CF6" stroke-width="1"/>
  <polygon points="115,185 105,190 115,195" fill="#8B5CF6"/>
  <text x="255" y="183" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="9">2. Authorization Code</text>

  <!-- Step 3 -->
  <line x1="110" y1="235" x2="690" y2="235" stroke="#60A5FA" stroke-width="1"/>
  <polygon points="685,230 695,235 685,240" fill="#60A5FA"/>
  <text x="400" y="228" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="9">3. Code + Client Secret</text>

  <!-- Step 4 -->
  <line x1="690" y1="270" x2="400" y2="270" stroke="#6EE7B7" stroke-width="1"/>
  <polygon points="405,265 395,270 405,275" fill="#6EE7B7"/>
  <text x="545" y="263" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="9">4. Exchange Token</text>

  <!-- Step 5 -->
  <line x1="400" y1="305" x2="690" y2="305" stroke="#6EE7B7" stroke-width="1"/>
  <polygon points="685,300 695,305 685,310" fill="#6EE7B7"/>
  <text x="545" y="298" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="9">5. Access Token</text>

  <!-- Step 6 -->
  <line x1="690" y1="340" x2="110" y2="340" stroke="#A78BFA" stroke-width="1"/>
  <polygon points="115,335 105,340 115,345" fill="#A78BFA"/>
  <text x="400" y="333" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="9">6. JWT Issued → Redirect</text>
</svg>
