<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" fill="none">
  <rect width="800" height="400" fill="#111113"/>
  <!-- Pipeline -->
  <text x="400" y="50" text-anchor="middle" fill="#55555C" font-family="monospace" font-size="11">CI/CD Pipeline</text>

  <!-- Stages -->
  <rect x="60" y="100" width="130" height="60" rx="8" stroke="#8B5CF6" stroke-width="1.5" fill="#1A1A1F"/>
  <text x="125" y="125" text-anchor="middle" fill="#EDEDEF" font-family="monospace" font-size="11">Push</text>
  <text x="125" y="143" text-anchor="middle" fill="#55555C" font-family="monospace" font-size="9">main branch</text>

  <line x1="190" y1="130" x2="230" y2="130" stroke="#8B5CF6" stroke-width="1"/>
  <polygon points="225,125 235,130 225,135" fill="#8B5CF6"/>

  <rect x="235" y="100" width="130" height="60" rx="8" stroke="#A78BFA" stroke-width="1" fill="#1A1A1F"/>
  <text x="300" y="125" text-anchor="middle" fill="#EDEDEF" font-family="monospace" font-size="11">Build</text>
  <text x="300" y="143" text-anchor="middle" fill="#55555C" font-family="monospace" font-size="9">gradle build</text>

  <line x1="365" y1="130" x2="405" y2="130" stroke="#8B5CF6" stroke-width="1"/>
  <polygon points="400,125 410,130 400,135" fill="#8B5CF6"/>

  <rect x="410" y="100" width="130" height="60" rx="8" stroke="#A78BFA" stroke-width="1" fill="#1A1A1F"/>
  <text x="475" y="125" text-anchor="middle" fill="#EDEDEF" font-family="monospace" font-size="11">Test</text>
  <text x="475" y="143" text-anchor="middle" fill="#55555C" font-family="monospace" font-size="9">JUnit 5</text>

  <line x1="540" y1="130" x2="580" y2="130" stroke="#8B5CF6" stroke-width="1"/>
  <polygon points="575,125 585,130 575,135" fill="#8B5CF6"/>

  <rect x="585" y="100" width="130" height="60" rx="8" stroke="#6EE7B7" stroke-width="1.5" fill="#1A3F2E"/>
  <text x="650" y="125" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11">Deploy</text>
  <text x="650" y="143" text-anchor="middle" fill="#55555C" font-family="monospace" font-size="9">docker push</text>

  <!-- Docker -->
  <rect x="200" y="230" width="400" height="100" rx="10" stroke="#2A2A30" stroke-width="1" fill="#1A1A1F"/>
  <text x="400" y="258" text-anchor="middle" fill="#55555C" font-family="monospace" font-size="10">Docker Container</text>
  <rect x="230" y="270" width="80" height="40" rx="6" fill="#2D1F5E"/>
  <text x="270" y="295" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="9">App</text>
  <rect x="320" y="270" width="80" height="40" rx="6" fill="#1E3A5F"/>
  <text x="360" y="295" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="9">MySQL</text>
  <rect x="410" y="270" width="80" height="40" rx="6" fill="#1A3F2E"/>
  <text x="450" y="295" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="9">Redis</text>

  <line x1="650" y1="160" x2="650" y2="210" stroke="#55555C" stroke-width="1" stroke-dasharray="4"/>
  <line x1="650" y1="210" x2="400" y2="210" stroke="#55555C" stroke-width="1" stroke-dasharray="4"/>
  <line x1="400" y1="210" x2="400" y2="230" stroke="#55555C" stroke-width="1" stroke-dasharray="4"/>
</svg>
